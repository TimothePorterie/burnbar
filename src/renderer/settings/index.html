<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.anthropic.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="settings.windowTitle">BurnBar Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- titleBarStyle 'hiddenInset': no native title, this bar is the drag region -->
    <div class="title-bar">
      <h1 data-i18n="settings.title">Settings</h1>
    </div>

    <main class="settings">
      <section id="accountSection">
        <h2 data-i18n="settings.account">Account</h2>
        <div class="group">
          <div class="row">
            <div class="status">
              <span class="status-dot" id="statusIndicator" aria-hidden="true"></span>
              <div class="status-info">
                <span id="statusText">--</span>
                <span class="row-sub selectable" id="statusEmail"></span>
              </div>
            </div>
            <button class="btn" id="refreshAccountBtn" data-i18n="settings.refreshAccount">Refresh</button>
          </div>

          <p class="row note" id="accountHint"></p>
        </div>
      </section>

      <section>
        <h2 data-i18n="settings.providers">Providers</h2>
        <div class="group">
          <div class="row" data-provider="claude">
            <label class="row-label" for="provider-claude">
              <span>Claude Code</span>
              <span class="row-sub provider-status"></span>
            </label>
            <input type="checkbox" role="switch" class="switch" id="provider-claude" />
          </div>
          <div class="row" data-provider="codex">
            <label class="row-label" for="provider-codex">
              <span>Codex</span>
              <span class="row-sub provider-status"></span>
            </label>
            <input type="checkbox" role="switch" class="switch" id="provider-codex" />
          </div>
          <div class="row" data-provider="grok">
            <label class="row-label" for="provider-grok">
              <span>Grok</span>
              <span class="row-sub provider-status"></span>
            </label>
            <input type="checkbox" role="switch" class="switch" id="provider-grok" />
          </div>
          <div class="row" data-provider="opencode">
            <label class="row-label" for="provider-opencode">
              <span>OpenCode</span>
              <span class="row-sub provider-status"></span>
            </label>
            <input type="checkbox" role="switch" class="switch" id="provider-opencode" />
          </div>
          <div class="row">
            <span class="row-label" id="trayProviderLabel" data-i18n="settings.trayProvider">Menu bar shows</span>
            <div class="segmented" id="trayProvider" role="radiogroup" aria-labelledby="trayProviderLabel">
              <button role="radio" data-value="claude">Claude</button>
              <button role="radio" data-value="codex">Codex</button>
              <button role="radio" data-value="max" data-i18n="settings.trayHighest">Highest</button>
            </div>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="settings.general">General</h2>
        <div class="group">
          <div class="row">
            <label class="row-label" for="language" data-i18n="settings.language">Language</label>
            <select id="language">
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
          </div>
          <div class="row">
            <span class="row-label" id="themeLabel" data-i18n="settings.theme">Appearance</span>
            <div class="segmented" id="theme" role="radiogroup" aria-labelledby="themeLabel">
              <button role="radio" data-value="system" data-i18n="settings.themeSystem">Auto</button>
              <button role="radio" data-value="light" data-i18n="settings.themeLight">Light</button>
              <button role="radio" data-value="dark" data-i18n="settings.themeDark">Dark</button>
            </div>
          </div>
          <div class="row">
            <span class="row-label" id="refreshLabel" data-i18n="settings.refreshShort">Refresh every</span>
            <div class="segmented" id="refreshInterval" role="radiogroup" aria-labelledby="refreshLabel">
              <button role="radio" data-value="300">5 min</button>
              <button role="radio" data-value="600">10 min</button>
              <button role="radio" data-value="900">15 min</button>
            </div>
          </div>
          <div class="row">
            <label class="row-label" for="enableNotifications">
              <span data-i18n="settings.alerts">Alerts</span>
              <span class="row-sub" data-i18n="settings.alertsDesc">At 70% and 90% usage</span>
            </label>
            <input type="checkbox" role="switch" class="switch" id="enableNotifications" checked />
          </div>
          <div class="row">
            <label class="row-label" for="launchAtLogin" data-i18n="settings.openAtLogin">Open at login</label>
            <input type="checkbox" role="switch" class="switch" id="launchAtLogin" />
          </div>
          <div class="row">
            <label class="row-label" for="showRemaining">
              <span data-i18n="settings.showRemaining">Show remaining</span>
              <span class="row-sub" data-i18n="settings.showRemainingDesc">58% left instead of 42% used</span>
            </label>
            <input type="checkbox" role="switch" class="switch" id="showRemaining" />
          </div>
          <div class="row" id="loginItemHint" hidden>
            <span class="row-sub" data-i18n="settings.loginItemApproval">Allow BurnBar in System Settings &gt; General &gt; Login Items</span>
            <button class="btn" id="openLoginItemsBtn" data-i18n="settings.openSystemSettings">Open Settings</button>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="settings.updates">Updates</h2>
        <div class="group">
          <div class="row">
            <div class="row-label">
              <span id="appVersion"></span>
              <span class="row-sub selectable" id="updateText" aria-live="polite"></span>
            </div>
            <button class="btn" id="checkUpdateBtn" data-i18n="settings.checkUpdates">Check for Updates</button>
            <button class="btn primary" id="installUpdateBtn" data-i18n="settings.installRestart" hidden>Install & Restart</button>
          </div>
          <div class="update-progress" id="updateProgress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="updateText" hidden>
            <div class="update-progress-bar" id="updateProgressBar"></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
