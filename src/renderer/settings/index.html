<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://api.anthropic.com https://console.anthropic.com; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Bar Settings</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- titleBarStyle 'hiddenInset': no native title, this bar is the drag region -->
    <div class="title-bar">
      <h1 data-i18n="settings.title">Settings</h1>
    </div>

    <main class="settings">
      <section>
        <h2 data-i18n="settings.account">Account</h2>
        <div class="group">
          <div class="row">
            <span class="row-label" id="authModeLabel" data-i18n="settings.source">Source</span>
            <div class="segmented" id="authMode" role="radiogroup" aria-labelledby="authModeLabel">
              <button role="radio" data-value="app" data-i18n-title="settings.authModeApp" title="Claude Bar (OAuth)">App</button>
              <button role="radio" data-value="cli" data-i18n-title="settings.authModeCli" title="Claude Code (Keychain)">CLI</button>
            </div>
          </div>

          <div class="row">
            <div class="status">
              <span class="status-dot" id="statusIndicator" aria-hidden="true"></span>
              <div class="status-info">
                <span id="statusText">--</span>
                <span class="row-sub selectable" id="statusEmail"></span>
              </div>
            </div>
            <button class="btn" id="logoutBtn" data-i18n="settings.logout" hidden>Log Out</button>
            <button class="btn primary" id="loginBtn" data-i18n="settings.loginWithClaude" hidden>Log In with Claude</button>
          </div>

          <p class="row note" id="cliHint" hidden></p>

          <div class="row auth-code" id="authCodeSection" hidden>
            <label for="authCodeInput" class="row-sub" data-i18n="settings.authHint">Authenticate in your browser, then paste the code below:</label>
            <div class="auth-code-input">
              <input type="text" id="authCodeInput" data-i18n-placeholder="settings.authPlaceholder" placeholder="Paste authorization code here" spellcheck="false" autocomplete="off" />
              <button class="btn primary" id="validateBtn" data-i18n="settings.validate">Validate</button>
              <button class="btn" id="cancelLoginBtn" data-i18n="settings.cancel">Cancel</button>
            </div>
            <span class="auth-error selectable" id="authError" role="alert" hidden></span>
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="settings.general">General</h2>
        <div class="group">
          <div class="row">
            <label class="row-label" for="language" data-i18n="settings.language">Language</label>
            <select id="language">
              <option value="en">English</option>
              <option value="fr">Français</option>
            </select>
          </div>
          <div class="row">
            <span class="row-label" id="refreshLabel" data-i18n="settings.refreshShort">Refresh every</span>
            <div class="segmented" id="refreshInterval" role="radiogroup" aria-labelledby="refreshLabel">
              <button role="radio" data-value="300">5 min</button>
              <button role="radio" data-value="600">10 min</button>
              <button role="radio" data-value="900">15 min</button>
            </div>
          </div>
          <div class="row">
            <label class="row-label" for="enableNotifications">
              <span data-i18n="settings.alerts">Alerts</span>
              <span class="row-sub" data-i18n="settings.alertsDesc">At 70% and 90% usage</span>
            </label>
            <input type="checkbox" role="switch" class="switch" id="enableNotifications" checked />
          </div>
          <div class="row">
            <label class="row-label" for="launchAtLogin" data-i18n="settings.openAtLogin">Open at login</label>
            <input type="checkbox" role="switch" class="switch" id="launchAtLogin" />
          </div>
        </div>
      </section>

      <section>
        <h2 data-i18n="settings.updates">Updates</h2>
        <div class="group">
          <div class="row">
            <div class="row-label">
              <span id="appVersion"></span>
              <span class="row-sub selectable" id="updateText" aria-live="polite"></span>
            </div>
            <button class="btn" id="checkUpdateBtn" data-i18n="settings.checkUpdates">Check for Updates</button>
            <button class="btn primary" id="installUpdateBtn" data-i18n="settings.installRestart" hidden>Install & Restart</button>
          </div>
          <div class="update-progress" id="updateProgress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-labelledby="updateText" hidden>
            <div class="update-progress-bar" id="updateProgressBar"></div>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./renderer.ts"></script>
  </body>
</html>
