name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # Decode API Key from base64 to file
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > /tmp/AuthKey.p8
          export APPLE_API_KEY=/tmp/AuthKey.p8

          # Pre-create a draft release: electron-builder uploads artifacts in parallel and,
          # when no release exists yet, several uploads each create their own duplicate.
          # Idempotent so a job re-run reuses the draft.
          VERSION=$(node -p "require('./package.json').version")
          gh release view "v$VERSION" >/dev/null 2>&1 || gh release create "v$VERSION" --draft --title "$VERSION" --notes ""
          npm run release
          gh release edit "v$VERSION" --draft=false --latest

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-artifacts
          path: |
            release/*.dmg
            release/*.zip
            release/*.yml
            release/*.blockmap
